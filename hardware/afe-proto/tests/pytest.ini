[pytest]
# Run as: .venv/bin/python -m pytest -c hardware/afe-proto/tests/pytest.ini
# The repository's own pytest.ini is for the Due suite; this one is the
# AFE pipeline's, so the two never share markers or a rootdir.
testpaths = .
addopts = -ra --strict-markers
markers =
    pcbnew: imports KiCad's pcbnew (10.x) in this interpreter; needs the 3.14 venv with system site-packages
    ngspice: runs ngspice; heavy, must go through the capped runner
    slow: tens of seconds or more
