[pytest]
# Run as: .venv/bin/python -m pytest -c hardware/afe-proto/tests/pytest.ini
# The repository's own pytest.ini is for the Due suite; this one is the
# AFE pipeline's, so the two never share markers or a rootdir.
testpaths = .
# golden_capture holds scripts that WRITE goldens: never collected, never imported by the collector
norecursedirs = golden_capture golden fixtures .* build dist venv *.egg __pycache__
addopts = -ra --strict-markers
markers =
    pcbnew: imports KiCad's pcbnew (10.x) in this interpreter; needs the 3.14 venv with system site-packages
    ngspice: runs ngspice; heavy, must go through the capped runner
    slow: tens of seconds or more
    jobcap: needs a cap on one job (systemd scope); in the container the cap is docker's and these are checked from the host by test_image_gate
    hostcap: runs jobs through the capped runner; needs systemd scopes on a host or the pcb container, so the numpy tier leaves it out
    docker: drives docker/pcb/run.sh from the host; needs docker and the built image, so it runs on the host and never inside the image
    vendor: needs the vendor SPICE models fetched by tools/fetch_models.py (untracked, hash-pinned); skipped without them, a failure under --require-tool=vendor
    network: downloads from the vendors' hosts; a separate step (-m network), never the gate, which runs --network none
