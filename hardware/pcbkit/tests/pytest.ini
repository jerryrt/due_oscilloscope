[pytest]
# Run inside the pinned PCB image from the repository root:
#   docker/pcb/run.sh python3 -m pytest -p no:cacheprovider -c hardware/pcbkit/tests/pytest.ini hardware/pcbkit/tests
testpaths = .
addopts = -ra --strict-markers
markers =
    pcbnew: builds a board with KiCad's pcbnew module and reads it back; skipped without pcbnew unless PCBKIT_REQUIRE_PCBNEW=1, then a failure
