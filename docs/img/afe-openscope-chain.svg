<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>The OpenScope MZ input chain, one channel, as blocks</title>
  <style>
    .box{fill:#fff;stroke:#1d2b28;stroke-width:1.6}
    .ref{fill:#eef6f7;stroke:#1d7a8a;stroke-width:1.6}
    .sw{fill:#fbf3e6;stroke:#c2781a;stroke-width:1.6}
    .adc{fill:#f5dede;stroke:#b8393b;stroke-width:1.6}
    .w{stroke:#1d2b28;stroke-width:2;fill:none}
    .wr{stroke:#1d7a8a;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
    .t{fill:#1d2b28;font-size:15px;font-weight:bold}
    .b{fill:#1d2b28;font-size:13px}
    .h{fill:#1d2b28;font-weight:bold;font-size:18px}
    .m{fill:#5d6b67;font-size:14px}
    .k{fill:#1d7a8a;font-size:13px}
    .o{fill:#8a5410;font-size:13px}
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1d2b28"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1d7a8a"/></marker>
  </defs>
  <rect width="960" height="640" fill="#f7f8f7"/>
  <text x="480" y="34" text-anchor="middle" class="h">OpenScope MZ, one scope channel: from the connector to the ADC pin</text>

  <!-- row 1: the signal path, y 80–170 -->
  <circle cx="26" cy="125" r="4" fill="#1d2b28"/>
  <text x="14" y="106" class="t">AIN</text><text x="8" y="150" class="m">±20 V</text>
  <path class="w" d="M30 125 L60 125" marker-end="url(#a)"/>

  <rect x="60" y="80" width="170" height="90" rx="4" class="box"/>
  <text x="145" y="102" text-anchor="middle" class="t">Attenuator</text>
  <text x="145" y="122" text-anchor="middle" class="b">IC5A LMV116, inverting</text>
  <text x="145" y="140" text-anchor="middle" class="b">1 MΩ in, 200 kΩ feedback</text>
  <text x="145" y="158" text-anchor="middle" class="b">gain −0.2, virtual ground</text>
  <path class="w" d="M230 125 L280 125" marker-end="url(#a)"/>
  <text x="255" y="112" text-anchor="middle" class="m">∓4 V</text>

  <rect x="280" y="80" width="160" height="90" rx="4" class="box"/>
  <text x="360" y="102" text-anchor="middle" class="t">Summing node</text>
  <text x="360" y="122" text-anchor="middle" class="b">3.6 kΩ from the signal</text>
  <text x="360" y="140" text-anchor="middle" class="b">3.41 kΩ from the 3.0 V ref</text>
  <text x="360" y="158" text-anchor="middle" class="b">1–10 kΩ from the offset</text>
  <path class="w" d="M440 125 L490 125" marker-end="url(#a)"/>

  <rect x="490" y="80" width="180" height="90" rx="4" class="box"/>
  <text x="580" y="102" text-anchor="middle" class="t">Gain and bandwidth</text>
  <text x="580" y="122" text-anchor="middle" class="b">IC6A LMV116, summer</text>
  <text x="580" y="140" text-anchor="middle" class="b">+ input held at 1.5 V</text>
  <text x="580" y="158" text-anchor="middle" class="b">Rf ‖ C: corner ≈ 1.5 MHz</text>
  <path class="w" d="M670 125 L720 125" marker-end="url(#a)"/>
  <text x="695" y="112" text-anchor="middle" class="m">0–3 V</text>

  <rect x="720" y="80" width="120" height="90" rx="4" class="box"/>
  <text x="780" y="102" text-anchor="middle" class="t">Pin driver</text>
  <text x="780" y="122" text-anchor="middle" class="b">68 Ω series</text>
  <text x="780" y="140" text-anchor="middle" class="b">470 pF to ground</text>
  <text x="780" y="158" text-anchor="middle" class="b">charge reservoir</text>
  <path class="w" d="M840 125 L880 125" marker-end="url(#a)"/>

  <rect x="880" y="95" width="60" height="60" rx="4" class="adc"/>
  <text x="910" y="121" text-anchor="middle" class="t">ADC</text>
  <text x="910" y="140" text-anchor="middle" class="b">pin</text>

  <!-- row 2: offset -->
  <rect x="60" y="230" width="290" height="72" rx="4" class="box"/>
  <text x="205" y="252" text-anchor="middle" class="t">Offset</text>
  <text x="205" y="272" text-anchor="middle" class="b">PWM pin → 470 Ω/4.7 µF → 511 Ω/4.7 µF</text>
  <text x="205" y="290" text-anchor="middle" class="b">→ IC3C buffer → resistor picked by the switch</text>
  <path class="w" d="M350 266 L385 266 L385 170" marker-end="url(#a)"/>
  <text x="378" y="212" text-anchor="end" class="m">10 mV steps</text>

  <!-- row 3: reference -->
  <rect x="60" y="350" width="430" height="72" rx="4" class="ref"/>
  <text x="275" y="372" text-anchor="middle" class="t">Reference</text>
  <text x="275" y="392" text-anchor="middle" class="k">LM4040-3.0 shunt, 56 Ω from 3.3 V, 10 µF → IC3A buffer = 3.000 V</text>
  <text x="275" y="410" text-anchor="middle" class="k">0.1% divider → IC3B buffer = 1.500 V</text>
  <path class="wr" d="M420 350 L420 170" marker-end="url(#ar)"/>
  <text x="428" y="300" class="k">3.0 V into</text>
  <text x="428" y="316" class="k">the node</text>
  <path class="wr" d="M490 390 L600 390 L600 170" marker-end="url(#ar)"/>
  <text x="608" y="384" class="k">1.5 V at the + input</text>
  <path class="wr" d="M490 412 L910 412 L910 155" marker-end="url(#ar)"/>
  <text x="640" y="432" class="k">3.0 V onto VREF+: the ADC's full scale</text>

  <!-- row 4: the switch, as a note -->
  <rect x="60" y="470" width="430" height="72" rx="4" class="sw"/>
  <text x="275" y="492" text-anchor="middle" class="t">TS3A5017 analog switch, dual 4:1, on 3.3 V</text>
  <text x="275" y="512" text-anchor="middle" class="o">bank 2 selects Rf in the gain stage: net gain 3/40, 1/8, 1/4, 1</text>
  <text x="275" y="530" text-anchor="middle" class="o">bank 1 selects the offset resistor into the summing node</text>

  <!-- footer -->
  <text x="30" y="580" class="m">One reference is the full scale, the level shift and the mid-rail: a drift moves all three together and cancels.</text>
  <text x="30" y="602" class="m">The bandwidth is set once, in the switched feedback. The 470 pF, not the op-amp, supplies the sample charge.</text>
  <text x="30" y="624" class="m">Ranges: net gain 3/40, 1/8, 1/4, 1 against ±1.5 V about 1.5 V → ±20, ±12, ±6, ±1.5 V full scale.</text>
</svg>
