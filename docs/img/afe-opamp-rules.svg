<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>The one op-amp rule, and the three stages it explains</title>
  <style>
    .w{stroke:#1d2b28;stroke-width:1.8;fill:none}
    .r{stroke:#1d2b28;stroke-width:1.6;fill:#fff}
    .t{fill:#1d2b28}
    .m{fill:#5d6b67;font-size:14px}
    .h{fill:#1d2b28;font-weight:bold;font-size:18px}
    .acc{fill:#b8393b;font-weight:bold;font-size:14px}
    .dot{fill:#1d2b28}
    .pin{fill:#1d2b28;font-size:16px;font-weight:bold}
  </style>
  <rect width="960" height="470" fill="#f7f8f7"/>
  <text x="480" y="30" text-anchor="middle" class="h">With negative feedback, the op-amp drives its output until its two inputs are equal.</text>

  <!-- ===== Follower ===== -->
  <g transform="translate(20,80)">
    <text x="150" y="0" text-anchor="middle" class="h">Follower (buffer)</text>
    <path class="w" d="M80 60 L80 140 L170 100 Z"/>
    <text x="90" y="86" class="pin">+</text><text x="90" y="126" class="pin">−</text>
    <path class="w" d="M20 80 L80 80"/><circle cx="20" cy="80" r="3.5" class="dot"/>
    <text x="10" y="68" class="t">Vin</text>
    <path class="w" d="M170 100 L250 100"/><circle cx="250" cy="100" r="3.5" class="dot"/>
    <text x="232" y="88" class="t">Vout</text>
    <path class="w" d="M210 100 L210 165 L50 165 L50 120 L80 120"/>
    <text x="0" y="215" class="m">Vout = Vin. Takes almost no current</text>
    <text x="0" y="235" class="m">from the source, drives the load.</text>
    <text x="0" y="265" class="acc">IC3A, IC3B; the DAC-to-A0 buffer</text>
  </g>

  <!-- ===== Inverting ===== -->
  <g transform="translate(340,80)">
    <text x="150" y="0" text-anchor="middle" class="h">Inverting amplifier</text>
    <!-- Vin, Rin -->
    <circle cx="0" cy="80" r="3.5" class="dot"/><text x="-8" y="68" class="t">Vin</text>
    <path class="w" d="M0 80 L30 80"/>
    <rect x="30" y="73" width="50" height="14" class="r"/><text x="55" y="66" text-anchor="middle" class="m">Rin 1 MΩ</text>
    <path class="w" d="M80 80 L130 80"/>
    <circle cx="105" cy="80" r="3.5" class="dot"/>
    <!-- Rf -->
    <path class="w" d="M105 80 L105 30 L150 30"/>
    <rect x="150" y="23" width="50" height="14" class="r"/><text x="175" y="16" text-anchor="middle" class="m">Rf 200 kΩ</text>
    <path class="w" d="M200 30 L250 30 L250 100"/>
    <!-- op-amp -->
    <path class="w" d="M130 60 L130 140 L220 100 Z"/>
    <text x="140" y="86" class="pin">−</text><text x="140" y="126" class="pin">+</text>
    <!-- + to ground -->
    <path class="w" d="M130 120 L118 120 L118 150"/>
    <path class="w" d="M106 150 L130 150 M110 156 L126 156 M114 162 L122 162"/>
    <!-- output -->
    <path class="w" d="M220 100 L290 100"/><circle cx="290" cy="100" r="3.5" class="dot"/>
    <text x="270" y="88" class="t">Vout</text>
    <!-- virtual ground leader -->
    <path class="w" d="M105 88 L105 182" stroke-dasharray="4 3"/>
    <text x="0" y="200" class="acc">virtual ground: this node stays at</text>
    <text x="0" y="218" class="acc">0 V whatever Vin does</text>
    <text x="0" y="252" class="m">Vout = −(Rf / Rin) · Vin = −0.2 · Vin.</text>
    <text x="0" y="272" class="m">Rin turns Vin into a current, Rf turns it</text>
    <text x="0" y="292" class="m">back into a voltage. The pin never sees</text>
    <text x="0" y="312" class="m">Vin: ±20 V is only ±20 µA.</text>
    <text x="0" y="342" class="acc">IC5A: the attenuator and the protection</text>
  </g>

  <!-- ===== Summing ===== -->
  <g transform="translate(660,80)">
    <text x="150" y="0" text-anchor="middle" class="h">Summing amplifier</text>
    <!-- inputs at y=40, 75, 110 -->
    <circle cx="0" cy="40" r="3.5" class="dot"/><text x="0" y="30" class="m">signal</text>
    <path class="w" d="M0 40 L30 40"/><rect x="30" y="33" width="44" height="14" class="r"/><text x="52" y="60" text-anchor="middle" class="m">3.6k</text>
    <path class="w" d="M74 40 L115 40"/>
    <circle cx="0" cy="75" r="3.5" class="dot"/><text x="0" y="65" class="m">3.0 V ref</text>
    <path class="w" d="M0 75 L30 75"/><rect x="30" y="68" width="44" height="14" class="r"/><text x="52" y="95" text-anchor="middle" class="m">3.41k</text>
    <path class="w" d="M74 75 L115 75"/>
    <circle cx="0" cy="110" r="3.5" class="dot"/><text x="0" y="100" class="m">offset</text>
    <path class="w" d="M0 110 L30 110"/><rect x="30" y="103" width="44" height="14" class="r"/><text x="52" y="130" text-anchor="middle" class="m">10k … 1k</text>
    <path class="w" d="M74 110 L115 110"/>
    <!-- node column and − pin -->
    <path class="w" d="M115 40 L115 110"/><circle cx="115" cy="90" r="3.5" class="dot"/>
    <path class="w" d="M115 90 L140 90"/>
    <!-- Rf switched -->
    <path class="w" d="M115 40 L115 18 L160 18"/>
    <rect x="160" y="11" width="60" height="14" class="r"/><text x="190" y="40" text-anchor="middle" class="m">Rf, switched</text>
    <path class="w" d="M220 18 L255 18 L255 110"/>
    <!-- op-amp -->
    <path class="w" d="M140 70 L140 150 L230 110 Z"/>
    <text x="150" y="96" class="pin">−</text><text x="150" y="136" class="pin">+</text>
    <path class="w" d="M140 130 L125 130 L125 150"/><text x="100" y="168" class="m">1.5 V</text>
    <!-- output -->
    <path class="w" d="M230 110 L295 110"/><circle cx="295" cy="110" r="3.5" class="dot"/>
    <text x="262" y="98" class="t">0–3 V</text>
    <text x="0" y="215" class="m">Currents add at the − node. One stage</text>
    <text x="0" y="235" class="m">does the level shift (ref), the gain</text>
    <text x="0" y="255" class="m">(Rf / 3.6k) and the offset. The output</text>
    <text x="0" y="275" class="m">is centred on the 1.5 V at the + input.</text>
    <text x="0" y="305" class="acc">IC6A, with the TS3A5017 choosing Rf</text>
  </g>
</svg>
