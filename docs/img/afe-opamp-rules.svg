<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>The one op-amp rule, and the three stages it explains</title>
  <style>
    .w{stroke:#1d2b28;stroke-width:1.8;fill:none}
    .r{stroke:#1d2b28;stroke-width:1.6;fill:#fff}
    .t{fill:#1d2b28}
    .m{fill:#5d6b67;font-size:14px}
    .h{fill:#1d2b28;font-weight:bold;font-size:18px}
    .acc{fill:#b8393b;font-weight:bold;font-size:14px}
    .dot{fill:#1d2b28}
    .pin{fill:#1d2b28;font-size:16px;font-weight:bold}
  </style>
  <rect width="980" height="480" fill="#f7f8f7"/>
  <text x="490" y="30" text-anchor="middle" class="h">With negative feedback, the op-amp drives its output until its two inputs are equal.</text>

  <!-- ===== Follower ===== -->
  <g transform="translate(20,80)">
    <text x="150" y="0" text-anchor="middle" class="h">Follower (buffer)</text>
    <path class="w" d="M80 60 L80 140 L170 100 Z"/>
    <text x="90" y="86" class="pin">+</text><text x="90" y="126" class="pin">−</text>
    <path class="w" d="M20 80 L80 80"/><circle cx="20" cy="80" r="3.5" class="dot"/>
    <text x="8" y="66" class="t">Vin</text>
    <path class="w" d="M170 100 L250 100"/><circle cx="250" cy="100" r="3.5" class="dot"/>
    <text x="234" y="86" class="t">Vout</text>
    <path class="w" d="M210 100 L210 165 L50 165 L50 120 L80 120"/>
    <text x="0" y="225" class="m">Vout = Vin. Takes almost no current</text>
    <text x="0" y="245" class="m">from the source, drives the load.</text>
    <text x="0" y="275" class="acc">IC3A, IC3B; the DAC-to-A0 buffer</text>
  </g>

  <!-- ===== Inverting ===== -->
  <g transform="translate(340,80)">
    <text x="155" y="0" text-anchor="middle" class="h">Inverting amplifier</text>
    <circle cx="0" cy="80" r="3.5" class="dot"/><text x="-10" y="66" class="t">Vin</text>
    <path class="w" d="M0 80 L30 80"/>
    <rect x="30" y="73" width="50" height="14" class="r"/><text x="55" y="64" text-anchor="middle" class="m">Rin 1 MΩ</text>
    <path class="w" d="M80 80 L130 80"/>
    <circle cx="105" cy="80" r="3.5" class="dot"/>
    <path class="w" d="M105 80 L105 26 L150 26"/>
    <rect x="150" y="19" width="50" height="14" class="r"/><text x="175" y="50" text-anchor="middle" class="m">Rf 200 kΩ</text>
    <path class="w" d="M200 26 L255 26 L255 100"/>
    <path class="w" d="M130 60 L130 140 L220 100 Z"/>
    <text x="140" y="86" class="pin">−</text><text x="140" y="126" class="pin">+</text>
    <path class="w" d="M130 120 L118 120 L118 150"/>
    <path class="w" d="M106 150 L130 150 M110 156 L126 156 M114 162 L122 162"/>
    <path class="w" d="M220 100 L295 100"/><circle cx="295" cy="100" r="3.5" class="dot"/>
    <text x="276" y="86" class="t">Vout</text>
    <path class="w" d="M105 88 L105 186" stroke-dasharray="4 3"/>
    <text x="0" y="204" class="acc">virtual ground: this node stays at</text>
    <text x="0" y="222" class="acc">0 V whatever Vin does</text>
    <text x="0" y="256" class="m">Vout = −(Rf / Rin) · Vin = −0.2 · Vin.</text>
    <text x="0" y="276" class="m">Rin turns Vin into a current, Rf turns it</text>
    <text x="0" y="296" class="m">back into a voltage. The pin never sees</text>
    <text x="0" y="316" class="m">Vin: ±20 V is only ±20 µA.</text>
    <text x="0" y="346" class="acc">IC5A: the attenuator and the protection</text>
  </g>

  <!-- ===== Summing ===== -->
  <g transform="translate(670,80)">
    <text x="150" y="0" text-anchor="middle" class="h">Summing amplifier</text>
    <!-- three inputs, rows 50 apart -->
    <circle cx="0" cy="44" r="3.5" class="dot"/><text x="0" y="32" class="m">signal</text>
    <path class="w" d="M0 44 L34 44"/><rect x="34" y="37" width="44" height="14" class="r"/><text x="56" y="66" text-anchor="middle" class="m">3.6k</text>
    <path class="w" d="M78 44 L118 44"/>
    <circle cx="0" cy="94" r="3.5" class="dot"/><text x="0" y="82" class="m">3.0 V ref</text>
    <path class="w" d="M0 94 L34 94"/><rect x="34" y="87" width="44" height="14" class="r"/><text x="56" y="116" text-anchor="middle" class="m">3.41k</text>
    <path class="w" d="M78 94 L118 94"/>
    <circle cx="0" cy="144" r="3.5" class="dot"/><text x="0" y="132" class="m">offset</text>
    <path class="w" d="M0 144 L34 144"/><rect x="34" y="137" width="44" height="14" class="r"/><text x="56" y="166" text-anchor="middle" class="m">10k … 1k</text>
    <path class="w" d="M78 144 L118 144"/>
    <!-- node column into the − pin -->
    <path class="w" d="M118 44 L118 144"/><circle cx="118" cy="100" r="3.5" class="dot"/>
    <path class="w" d="M118 100 L145 100"/>
    <!-- Rf, switched -->
    <path class="w" d="M118 44 L118 20 L165 20"/>
    <rect x="165" y="13" width="56" height="14" class="r"/>
    <path class="w" d="M221 20 L262 20 L262 120"/>
    <text x="193" y="46" text-anchor="middle" class="m">Rf, switched</text>
    <!-- op-amp -->
    <path class="w" d="M145 80 L145 160 L235 120 Z"/>
    <text x="155" y="106" class="pin">−</text><text x="155" y="146" class="pin">+</text>
    <path class="w" d="M145 140 L130 140 L130 170"/><text x="112" y="188" class="m">1.5 V</text>
    <path class="w" d="M235 120 L300 120"/><circle cx="300" cy="120" r="3.5" class="dot"/>
    <text x="268" y="106" class="t">0–3 V</text>
    <text x="0" y="225" class="m">Currents add at the − node. One stage</text>
    <text x="0" y="245" class="m">does the level shift (ref), the gain</text>
    <text x="0" y="265" class="m">(Rf / 3.6k) and the offset. The output</text>
    <text x="0" y="285" class="m">is centred on the 1.5 V at the + input.</text>
    <text x="0" y="315" class="acc">IC6A, with the TS3A5017 choosing Rf</text>
  </g>
</svg>
