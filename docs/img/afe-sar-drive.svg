<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Why a SAR ADC pin wants 68 ohms and 470 pF, and what the reference does</title>
  <style>
    .w{stroke:#1d2b28;stroke-width:1.8;fill:none}
    .r{stroke:#1d2b28;stroke-width:1.6;fill:#fff}
    .t{fill:#1d2b28;font-size:14px}
    .h{fill:#1d2b28;font-weight:bold;font-size:17px}
    .m{fill:#5d6b67;font-size:14px}
    .acc{fill:#b8393b;font-weight:bold;font-size:14px}
    .k{fill:#1d7a8a;font-size:14px;font-weight:bold}
    .dot{fill:#1d2b28}
    .chip{fill:#f5dede;stroke:#b8393b;stroke-width:1.4;stroke-dasharray:5 3}
  </style>
  <rect width="940" height="600" fill="#f7f8f7"/>
  <line x1="470" y1="20" x2="470" y2="580" stroke="#d5dcd9"/>

  <!-- ===== left: SAR drive ===== -->
  <g transform="translate(20,30)">
    <text x="0" y="0" class="h">The sample-and-hold charges in nanoseconds</text>
    <!-- op-amp -->
    <path class="w" d="M20 80 L20 140 L80 110 Z"/>
    <text x="0" y="165" class="m">op-amp</text>
    <path class="w" d="M80 110 L110 110"/>
    <!-- 68R -->
    <rect x="110" y="103" width="50" height="14" class="r"/><text x="135" y="96" text-anchor="middle" class="m">68 Ω</text>
    <path class="w" d="M160 110 L250 110"/>
    <circle cx="200" cy="110" r="3.5" class="dot"/>
    <!-- 470p -->
    <path class="w" d="M200 110 L200 150 M188 150 L212 150 M188 160 L212 160 M200 160 L200 190"/>
    <path class="w" d="M188 190 L212 190 M192 196 L208 196 M196 202 L204 202"/>
    <text x="150" y="240" class="m">470 pF</text>
    <text x="130" y="258" class="acc">the reservoir</text>
    <!-- chip boundary -->
    <rect x="250" y="50" width="190" height="170" rx="6" class="chip"/>
    <text x="345" y="70" text-anchor="middle" class="m">inside the ADC</text>
    <!-- switch -->
    <path class="w" d="M250 110 L280 110"/>
    <circle cx="280" cy="110" r="3.5" class="dot"/>
    <path class="w" d="M280 110 L312 92"/>
    <circle cx="318" cy="110" r="3.5" class="dot"/>
    <path class="w" d="M318 110 L360 110"/>
    <text x="345" y="135" text-anchor="middle" class="m">sample switch</text>
    <!-- Cs -->
    <path class="w" d="M360 110 L360 150 M348 150 L372 150 M348 160 L372 160 M360 160 L360 190"/>
    <path class="w" d="M348 190 L372 190 M352 196 L368 196 M356 202 L364 202"/>
    <text x="378" y="158" class="m">a few pF</text>
    <text x="378" y="176" class="m">sampling cap</text>
    <!-- explanation -->
    <text x="0" y="300" class="m">When the switch closes, the sampling capacitor</text>
    <text x="0" y="320" class="m">must charge to the input voltage before it opens.</text>
    <text x="0" y="340" class="m">An op-amp cannot respond that fast. The 470 pF,</text>
    <text x="0" y="360" class="m">hundreds of times larger, supplies the charge and</text>
    <text x="0" y="380" class="m">barely moves; the 68 Ω keeps the op-amp stable</text>
    <text x="0" y="400" class="m">into that capacitor and refills it between samples.</text>
    <text x="0" y="432" class="acc">Without the reservoir the reading sags by the</text>
    <text x="0" y="450" class="acc">ratio of the two capacitors. A bare wire is worse.</text>
    <text x="0" y="482" class="m">68 Ω × 470 pF gives a corner near 5 MHz: this is</text>
    <text x="0" y="502" class="m">the charge path, not the anti-alias filter.</text>
  </g>

  <!-- ===== right: reference ===== -->
  <g transform="translate(500,30)">
    <text x="0" y="0" class="h">The reference is the ADC&apos;s scale</text>
    <!-- 3.3V rail -->
    <text x="0" y="74" class="t">3.3 V</text>
    <path class="w" d="M42 70 L70 70"/>
    <rect x="70" y="63" width="50" height="14" class="r"/><text x="95" y="56" text-anchor="middle" class="m">56 Ω</text>
    <path class="w" d="M120 70 L170 70"/>
    <circle cx="170" cy="70" r="3.5" class="dot"/>
    <!-- shunt ref drawn as a zener -->
    <path class="w" d="M170 70 L170 100"/>
    <path class="w" d="M158 100 L182 100 L170 124 Z M158 124 L182 124 M154 124 L158 118 M182 124 L186 130"/>
    <path class="w" d="M170 124 L170 150 M158 150 L182 150 M162 156 L178 156 M166 162 L174 162"/>
    <text x="150" y="108" text-anchor="end" class="m">LM4040-3.0</text>
    <text x="150" y="126" text-anchor="end" class="m">holds 3.000 V</text>
    <text x="150" y="144" text-anchor="end" class="m">to 0.1%</text>
    <!-- cap -->
    <path class="w" d="M170 70 L290 70 L290 96 M278 96 L302 96 M278 106 L302 106 M290 106 L290 150 M278 150 L302 150 M282 156 L298 156 M286 162 L294 162"/>
    <text x="308" y="132" class="m">10 µF</text>
    <!-- buffer -->
    <path class="w" d="M290 70 L340 70"/>
    <path class="w" d="M340 50 L340 90 L385 70 Z"/>
    <path class="w" d="M362 80 L362 100 L330 100 L330 82 L340 82"/>
    <path class="w" d="M385 70 L420 70"/>
    <circle cx="420" cy="70" r="4" class="dot"/>
    <text x="352" y="42" class="k">VREF 3.0 V</text>
    <!-- divider down to 1.5 V -->
    <path class="w" d="M420 70 L420 190"/>
    <rect x="413" y="190" width="14" height="44" class="r"/>
    <path class="w" d="M420 234 L420 256"/>
    <circle cx="420" cy="256" r="3.5" class="dot"/>
    <rect x="413" y="256" width="14" height="44" class="r"/>
    <path class="w" d="M420 300 L420 318 M408 318 L432 318 M412 324 L428 324 M416 330 L424 330"/>
    <text x="330" y="216" text-anchor="end" class="m">0.1% resistors</text>
    <path class="w" d="M420 256 L400 256"/>
    <text x="392" y="260" text-anchor="end" class="k">1.5 V, buffered</text>
    <text x="392" y="278" text-anchor="end" class="m">the mid-rail</text>
    <text x="400" y="180" text-anchor="end" class="m">to VREF+ (AREF on the Due)</text>
    <text x="400" y="198" text-anchor="end" class="m">and the level-shift current</text>
    <!-- explanation -->
    <text x="0" y="372" class="m">code = 4095 × Vin / Vref. A mid-rail made from a</text>
    <text x="0" y="392" class="m">divider off the 3.3 V rail moves with the rail and</text>
    <text x="0" y="412" class="m">the load, so every reading moves with it.</text>
    <text x="0" y="444" class="acc">One part is the full scale, the level shift and</text>
    <text x="0" y="462" class="acc">the mid-rail: a drift cancels in the ratio.</text>
    <text x="0" y="494" class="m">The buffer is there because the shunt can supply</text>
    <text x="0" y="514" class="m">only a little current; VREF+ and the network</text>
    <text x="0" y="534" class="m">need more than it should give.</text>
  </g>
</svg>
